name: Run tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        # macos-15-intel (x86_64): GitHub's macOS arm64 pool keeps failing to
        # acquire runners ("capacity constraints"), cancelling the job
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        dependencies: ["latest", "old"]
        exclude:
          # The old-dependency envs are linux-64/win-64 only, so exclude this combo
          - os: macos-15-intel
            dependencies: "old"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for git history (tags)

    - uses: prefix-dev/setup-pixi@v0.9.1
      with:
        environments: >-
          test-${{ matrix.dependencies }}
          test-xarray-${{ matrix.dependencies }}

    - name: Run basic tests
      run: |
        pixi run -e test-${{ matrix.dependencies }} basic-tests

    - name: Run xarray tests
      run: |
        pixi run -e test-xarray-${{ matrix.dependencies }} xarray-tests
