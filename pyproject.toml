[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tcpyPI"
dynamic = ["version"]
description = "tcpyPI: Tropical cyclone potential intensity calculations in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE" }
authors = [
    { name = "Daniel M. Gilford, PhD", email = "dgilford@climatecentral.org" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science"
]
dependencies = [
    "numba>=0.59",
    "numpy>=1.26"
]

[project.optional-dependencies]
xarray = ["xarray", "h5netcdf"]
demo = ["xarray", "h5netcdf", "matplotlib", "pooch"]

[project.urls]
Homepage = "https://github.com/dgilford/tcpyPI"
Download = "https://github.com/dgilford/tcpyPI"
Documentation = "https://github.com/dgilford/tcpyPI#readme"
Issues = "https://github.com/dgilford/tcpyPI/issues"

# Configure hatch-vcs to extract version information from version control (e.g. Git tags)
[tool.hatch.version]
source = "vcs" 

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/data",
  "/dist",
  "/figures",
  "/matlab_scripts",
  "/notebooks",
  "/tests",
  "/pyPI_Users_Guide_v1.3.pdf",
  "/run_sample.py",
] 

[tool.hatch.build.targets.wheel]
packages = ["src/tcpyPI"] 

[tool.pytest.ini_options]
addopts = ["--doctest-modules", "-v"]


# Pixi is used for managing Conda environments in the development of tcpyPI.
# It is not required for the installation or usage of tcpyPI.
[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
tcpypi = {path = ".", editable = true}

[tool.pixi.dependencies]
# Putting these here to install from conda-forge instead of PyPI.
# The version constraints will get picked up from the tcpyPI PyPI editable package.
python = "*"
numpy = "*"
numba = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-xdist = "*"

[tool.pixi.feature.test.tasks]
basic-tests = "python -m pytest -n auto --ignore run_sample.py --ignore tests/test_run_sample.py --ignore data"
xarray-tests = "python -m pytest -n auto tests/test_run_sample.py"

[tool.pixi.feature.min-dependency-versions.dependencies]
# Pinned to the declared support floor (requires-python >=3.10) so CI keeps the
# minimum-version claim honest. Update in lockstep with the [project] dependencies.
python = "3.10.*"
numba = "0.59.*"
numpy = "1.26.*"

[tool.pixi.feature.xarray.dependencies]
xarray = "*"
h5netcdf = "*"

[tool.pixi.feature.notebook.dependencies]
ipykernel = "*"
matplotlib = "*"

# Data-download / sample-build workflow (maintainer only; needs a CDS API key in
# ~/.cdsapirc). Not required to install or use tcpyPI.
[tool.pixi.feature.data.dependencies]
cdsapi = "*"
xarray = "*"
h5netcdf = "*"
numpy = "*"

[tool.pixi.feature.data.tasks]
download-era5 = { cmd = "python download_era5.py && python download_era5_sl.py", cwd = "data" }
build-sample = "python data/build_sample_data_era5_oct2024.py"

# Benchmark-only environment: adds Skyborn (compiled-Fortran PI backend, issue #86)
# for the optional three-way comparison in notebooks/clock_pypi.ipynb. Not used by
# the package or CI.
[tool.pixi.feature.bench.pypi-dependencies]
skyborn = "*"

[tool.pixi.target.osx-64.dependencies]
# Workaround for duplicate LD_RPATH issue on MacOS 15.4
# <https://github.com/prefix-dev/pixi/issues/3479>
# <https://stackoverflow.com/questions/79565969>
libgfortran5 = ">=14"

[tool.pixi.target.osx-arm64.dependencies]
# Workaround for duplicate LD_RPATH issue on MacOS 15.4
# <https://github.com/prefix-dev/pixi/issues/3479>
# <https://stackoverflow.com/questions/79565969>
libgfortran5 = ">=14"



[tool.pixi.environments]
default = {features = ["test", "xarray", "notebook", "data"], solve-group = "default"}
bench = {features = ["test", "xarray", "notebook", "bench"], solve-group = "bench"}
minimal = {features = [], solve-group = "default"}
# CI test environments,
test-latest = {features = ["test"], solve-group = "default"}
test-xarray-latest = {features = ["test", "xarray"], solve-group = "default"}
test-min = {features = ["test", "min-dependency-versions"], solve-group = "min"}
test-xarray-min = {features = ["test", "xarray", "min-dependency-versions"], solve-group = "min"}
